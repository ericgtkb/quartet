[package]
name = "quartet-harmony-server"
description = "gRPC server for Quartet's world engine."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14.6"
quartet-harmony = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
